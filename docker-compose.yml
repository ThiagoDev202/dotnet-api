services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SwaggerEnabled: "true"
      ASPNETCORE_URLS: http://+:8080
      # Runtime conecta com a role restrita orders_app, sujeita ao RLS (isolamento por
      # cliente garantido no banco, não só na aplicação).
      # APP_DB_PASSWORD obrigatório — defina no .env (nunca commitar o valor real).
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=orderservice;
        Username=orders_app;Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD obrigatório — defina no .env}
      # Migração usa superuser para executar DDL privilegiado (CREATE ROLE, ENABLE RLS, GRANT).
      ConnectionStrings__MigrationConnection: >-
        Host=postgres;Port=5432;Database=orderservice;
        Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:?JWT_KEY obrigatório — defina no .env ou como variável de ambiente}
      Jwt__Issuer: OrderService
      Jwt__Audience: OrderServiceApi
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
