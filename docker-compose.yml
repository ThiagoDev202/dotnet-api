services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderservice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Conecta como superuser para que as migrations possam executar DDL (CREATE ROLE, RLS, GRANT)
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=orderservice;
        Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:?JWT_KEY obrigatório — defina no .env ou como variável de ambiente}
      Jwt__Issuer: OrderService
      Jwt__Audience: OrderServiceApi
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
